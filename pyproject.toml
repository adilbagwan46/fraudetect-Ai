[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudetect-ai"
version = "0.1.0"
description = "AI-powered payment fraud risk detection and investigation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]
ml = [
  "joblib>=1.4,<2",
  "networkx>=3.3,<4",
  "scikit-learn>=1.5,<2",
]
llm = [
  "google-genai>=2.19,<3",
  "openai>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
