services:
  - type: web
    name: fraudetect-ai-showcase
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: >-
      python -m pip install -r requirements-deploy.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      python scripts/showcase_runtime.py install
    startCommand: >-
      python scripts/showcase_runtime.py prepare-case-store &&
      uvicorn backend.app.deployment:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    disk:
      name: fraudetect-showcase-data
      mountPath: /var/data/fraudetect
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 24.14.1
      - key: FRAUDETECT_ENV
        value: production
      - key: FRAUDETECT_FRONTEND_DIST
        value: frontend/dist
      - key: FRAUDETECT_MODEL_ARTIFACT_ROOT
        value: artifacts/runtime/models
      - key: FRAUDETECT_BEHAVIORAL_HISTORY_DB
        value: artifacts/runtime/demo/behavior.sqlite
      - key: FRAUDETECT_RELATIONSHIP_HISTORY_DB
        value: artifacts/runtime/demo/relationship.sqlite
      - key: FRAUDETECT_CASE_DATABASE
        value: /var/data/fraudetect/cases.sqlite
      - key: FRAUDETECT_SHOWCASE_CASE_SEED
        value: artifacts/runtime/demo/cases.sqlite
      - key: FRAUDETECT_LLM_ENABLED
        value: "false"
      - key: FRAUDETECT_RUNTIME_ARTIFACT_URL
        sync: false
      - key: FRAUDETECT_RUNTIME_ARTIFACT_SHA256
        sync: false
